name: Monitor voli Roma-New York

on:
  schedule:
    - cron: "17 * * * *"   # ogni ora al minuto 17 (orario UTC)
  workflow_dispatch:        # ti lascia lanciarlo a mano dal tab Actions

permissions:
  contents: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install fast-flights requests

      - name: Cerca voli
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_voli.py

      - name: Salva lo stato
        run: |
          git config user.name "flight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stato.json
          git diff --staged --quiet || git commit -m "aggiorna prezzi [skip ci]"
          git push
